name: Release validation
description: Track clean-machine validation for a KnowBase Windows release candidate.
title: "[Release Validation]: "
labels: ["release", "desktop", "packaging"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue before publishing a customer installer.

        Do not attach API keys, private documents, local databases, `.env` files, or `%APPDATA%\KnowBase` folders.

  - type: input
    id: release_version
    attributes:
      label: Release version
      placeholder: 0.1.0-rc.1
    validations:
      required: true

  - type: input
    id: installer
    attributes:
      label: Installer artifact
      placeholder: KnowBase_0.1.0_x64-setup.exe
    validations:
      required: true

  - type: input
    id: installer_sha256
    attributes:
      label: Installer SHA256
      placeholder: E7983E649266CF155F2DECDA68B284BCDCA9B1E75B480781F9302D6B45D46D7F
    validations:
      required: true

  - type: dropdown
    id: signature_policy
    attributes:
      label: Signature policy decision
      description: Select the decision supported by the installer signature check and release notes.
      options:
        - Valid signature verified
        - Unsigned build explicitly approved and disclosed
        - Signature invalid or undecided - block release
    validations:
      required: true

  - type: textarea
    id: signature_evidence
    attributes:
      label: Signature decision evidence
      description: For a valid signature, record the signer and certificate thumbprint. Unsigned approver, approval date, and exact release-notes disclosure are required for an approved unsigned build.
      placeholder: |
        Signature status:
        Signer and certificate thumbprint:
        Unsigned approver:
        Approval date:
        Release-notes disclosure:
    validations:
      required: true

  - type: checkboxes
    id: clean_machine
    attributes:
      label: Clean machine baseline
      options:
        - label: Test machine does not have Python installed.
        - label: Test machine does not have Node.js installed.
        - label: Test machine does not have Rust installed.
        - label: Test machine does not have Git installed.
        - label: Test machine does not have the KnowBase source checkout.
        - label: Test machine has internet access.
        - label: Test machine has a valid LLM provider API key for testing.

  - type: checkboxes
    id: install_launch
    attributes:
      label: Install and launch
      options:
        - label: Installer runs without developer tools.
        - label: KnowBase launches from Start Menu or desktop shortcut.
        - label: Desktop app starts the backend automatically.
        - label: App opens without a developer terminal.
        - label: App stores runtime data under `%APPDATA%\KnowBase`.
        - label: check-installed-app.ps1 report was generated and reviewed.
        - label: collect-support-info.ps1 report was generated for any install, launch, backend, or health check failure.

  - type: checkboxes
    id: first_run
    attributes:
      label: First-run flow
      options:
        - label: User registration succeeds.
        - label: Login succeeds.
        - label: Knowledge base creation succeeds.
        - label: API key settings accepts a valid provider key.
        - label: PDF upload and cited chat answer work.
        - label: Word upload and cited chat answer work.
        - label: Markdown upload and cited chat answer work.
        - label: TXT upload and cited chat answer work.
        - label: CSV upload and cited chat answer work.
        - label: CSV Analysis tab preview, query, chart, summary, and history work.
        - label: Recent conversations reopen correctly.
        - label: Conversation deletion uses in-app confirmation.

  - type: checkboxes
    id: shutdown_security
    attributes:
      label: Shutdown, security, and privacy
      options:
        - label: Closing the app stops the backend process.
        - label: Relaunch keeps account, knowledge base, documents, and conversations.
        - label: No API key appears in visible logs.
        - label: No document content appears in visible logs.
        - label: No `.env`, database, uploaded document, or `%APPDATA%\KnowBase` folder is attached to this issue.
        - label: Local data backup dry-run was reviewed without sharing the backup ZIP.
        - label: Local data restore dry-run was reviewed when reinstall or migration was tested.
        - label: Local data removal dry-run was reviewed before any confirmed deletion.

  - type: textarea
    id: failures
    attributes:
      label: Failures or notes
      description: List any failed checks, the exact non-sensitive error text, and whether `docs\customer-troubleshooting.md` resolved the issue.
      placeholder: |
        - Failed check:
        - Windows version:
        - Non-sensitive error:
        - Support report generated:

  - type: checkboxes
    id: release_gate
    attributes:
      label: Release gate attestation
      options:
        - label: A Ready decision is selected only when every required validation check above is complete; otherwise the release decision is Block release and failures are documented.
          required: true

  - type: dropdown
    id: release_decision
    attributes:
      label: Release decision
      options:
        - Block release
        - Ready for limited tester release
        - Ready for public release
    validations:
      required: true
