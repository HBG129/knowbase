name: Feature request
description: Suggest a KnowBase improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
      placeholder: Example: I need to share a read-only knowledge base with another user.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should KnowBase do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RAG quality
        - Desktop packaging
        - Onboarding
        - API key setup
        - Knowledge base sharing
        - OAuth or authentication
        - Document processing
        - UI or accessibility
        - Security or privacy
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround are you using today?

  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How would we know this feature is working?
      placeholder: Example: A user can create a read-only link, open it on another machine, and view cited answers without editing the source knowledge base.
