name: Beta feedback
description: Share structured feedback after testing a KnowBase beta installer.
title: "[Beta Feedback]: "
labels: ["beta", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form after testing a KnowBase beta installer.

        Do not attach API keys, private documents, local databases, `.env` files, or `%APPDATA%\KnowBase` folders.

  - type: input
    id: installer
    attributes:
      label: Installer artifact
      placeholder: KnowBase_0.1.0_x64-setup.exe
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Completed core workflow
        - Completed with minor issues
        - Blocked by install or launch
        - Blocked by upload or chat
        - Blocked by API key or provider
        - Other blocker
    validations:
      required: true

  - type: checkboxes
    id: completed_tasks
    attributes:
      label: Completed tasks
      options:
        - label: Installed without Python, Node.js, Rust, Git, or source code.
        - label: Launched from installed shortcut.
        - label: Registered a local account.
        - label: Created a knowledge base.
        - label: Configured an LLM provider key.
        - label: Uploaded at least one non-sensitive document.
        - label: Asked a question and received citations.
        - label: Reopened a recent conversation.
        - label: Deleted a conversation with confirmation.
        - label: Closed the app normally.

  - type: textarea
    id: issues
    attributes:
      label: Issues or blockers
      description: List failed tasks and exact non-sensitive error text.
      placeholder: |
        - Failed task:
        - Expected:
        - Actual:

  - type: textarea
    id: usability
    attributes:
      label: Usability feedback
      description: What felt confusing, slow, missing, or unexpectedly good?

  - type: dropdown
    id: recommendation
    attributes:
      label: Would you use this again with non-sensitive documents?
      options:
        - "Yes"
        - "Maybe, after fixes"
        - "No"
    validations:
      required: true

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach API keys, private documents, local databases, `.env` files, or `%APPDATA%\KnowBase` folders.
          required: true
