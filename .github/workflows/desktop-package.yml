name: Desktop Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-package.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/check-code-signature.ps1"
      - "scripts/check-desktop-artifacts.ps1"
      - "scripts/check-packaged-backend-health.ps1"
      - "scripts/prepare-webview2-fixed-runtime.ps1"
      - "check-desktop-prereqs.bat"
      - "package-backend.bat"
      - "package-desktop.bat"

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Miniconda Python
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.12"
          auto-update-conda: false
          auto-activate: true
          activate-environment: base
          channels: defaults

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m venv backend\.venv
          .\backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\backend\.venv\Scripts\python.exe -c "import subprocess, sys, tomllib; p=tomllib.load(open('backend/pyproject.toml','rb'))['project']; deps=p['dependencies']+p['optional-dependencies']['dev']+p['optional-dependencies']['packaging']; subprocess.check_call([sys.executable,'-m','pip','install',*deps])"
          "CONDA_DLL_DIR=$env:CONDA_PREFIX\Library\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Python dependencies
        working-directory: backend
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip_audit --local --strict

      - name: Run backend tests
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data\pytest-tmp | Out-Null
          .\.venv\Scripts\python.exe -m pytest tests -q --basetemp data\pytest-tmp -p no:cacheprovider

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Tauri runtime tests
        working-directory: frontend/src-tauri
        shell: pwsh
        run: |
          rustc --edition 2021 --test src/backend_runtime.rs -o target/backend-runtime-tests.exe
          .\target\backend-runtime-tests.exe

      - name: Build desktop package
        shell: cmd
        env:
          KNOWBASE_NO_PAUSE: "1"
        run: package-desktop.bat

      - name: Verify packaged backend health
        shell: pwsh
        run: .\scripts\check-packaged-backend-health.ps1

      - name: Verify desktop artifacts
        shell: pwsh
        run: .\scripts\check-desktop-artifacts.ps1

      - name: Check installer code signature status
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath frontend\src-tauri\target\release\bundle\nsis -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer found for code signature check."
          }
          .\scripts\check-code-signature.ps1 -Path $installer.FullName -AllowUnsigned

      - name: Upload backend executable
        uses: actions/upload-artifact@v7
        with:
          name: KnowBaseBackend-${{ github.run_number }}
          path: backend/dist/KnowBaseBackend.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop installer bundle
        uses: actions/upload-artifact@v7
        with:
          name: KnowBaseDesktop-Windows-${{ github.run_number }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
