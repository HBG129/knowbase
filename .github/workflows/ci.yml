name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    name: Repository checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check PowerShell scripts
        shell: pwsh
        run: .\scripts\check-powershell-scripts.ps1

      - name: Check version consistency
        shell: pwsh
        run: .\scripts\check-version-consistency.ps1

      - name: Check sensitive tracked files
        shell: pwsh
        run: .\scripts\check-sensitive-files.ps1

      - name: Check release documentation
        shell: pwsh
        run: .\scripts\check-release-docs.ps1

      - name: Check complete bilingual localization
        shell: pwsh
        run: .\scripts\check-i18n-coverage.ps1

      - name: Check release preflight
        shell: pwsh
        run: .\scripts\check-release-preflight.ps1 -SkipGitStatus

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev --no-install-project --python python

      - name: Audit Python dependencies
        run: .venv/bin/python -m pip_audit --local --strict

      - name: Run tests
        run: |
          mkdir -p data/pytest-tmp
          .venv/bin/python -m pytest tests -q --basetemp data/pytest-tmp -p no:cacheprovider
