name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    name: Repository checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell scripts
        shell: pwsh
        run: .\scripts\check-powershell-scripts.ps1

      - name: Check version consistency
        shell: pwsh
        run: .\scripts\check-version-consistency.ps1

      - name: Check sensitive tracked files
        shell: pwsh
        run: .\scripts\check-sensitive-files.ps1

      - name: Check release documentation
        shell: pwsh
        run: .\scripts\check-release-docs.ps1

      - name: Check release preflight
        shell: pwsh
        run: .\scripts\check-release-preflight.ps1 -SkipGitStatus

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]

          deps = project["dependencies"] + project["optional-dependencies"]["dev"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY

      - name: Run tests
        run: |
          mkdir -p data/pytest-tmp
          python -m pytest tests -q --basetemp data/pytest-tmp -p no:cacheprovider
